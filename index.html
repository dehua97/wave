<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050810" />
    <meta name="description" content="艾略特波浪 × 消息面共振的多品种交易分析终端：黄金、白银、原油、A股指数与个股。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 18 L7 8 L11 13 L15 4 L19 10 L22 6' stroke='%23fbbf24' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='6' r='1.8' fill='%23fbbf24'/%3E%3C/svg%3E" />
    <title>波浪共振交易终端</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 首屏加载动画：纯内联，不依赖任何JS/CSS文件，避免白屏/黑屏 */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #050810; color: #e8ecf4;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        transition: opacity .35s ease;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash .logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: .05em; }
      #splash .logo b { color: #fbbf24; }
      #splash .bar { width: 180px; height: 2px; background: #1a2540; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 40%; background: #fbbf24; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(450%);} }
      #splash .tip { font-size: 11px; color: #5b6578; letter-spacing: .2em; font-family: "JetBrains Mono", monospace; }
      #splash .err { max-width: 82vw; font-size: 13px; line-height: 1.8; color: #f87171; text-align: center; }
    </style>
  </head>
  <body style="background:#050810">
    <div id="splash">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M2 18 L7 8 L11 13 L15 4 L19 10 L22 6" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" />
          <circle cx="22" cy="6" r="1.8" fill="#fbbf24" />
        </svg>
        <span>波浪共振<b>交易终端</b></span>
      </div>
      <div class="bar"><i></i></div>
      <div class="tip" id="splash-tip">ELLIOTT × SENTIMENT · LOADING</div>
    </div>
    <noscript><div style="position:fixed;inset:0;background:#050810;color:#e8ecf4;display:flex;align-items:center;justify-content:center;">需要启用 JavaScript 才能使用本终端。</div></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
